<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TiffinX — Admin</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#FBF7EC;color:#262B33;margin:0;padding:24px;}
  h1{font-size:20px;} h2{font-size:16px;margin:0 0 10px;}
  #loginBox{max-width:340px;margin:60px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  #loginBox input{width:100%;padding:10px;margin:6px 0 14px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;}
  #loginBox button{width:100%;padding:10px;background:#5FA83D;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
  #err{color:#b3261e;font-size:13px;min-height:18px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee;font-size:14px;vertical-align:top;}
  th{background:#262B33;color:#fff;position:sticky;top:0;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;} tr.clickable:hover{background:#f7f4ea;}
  select{padding:4px;border-radius:4px;}
  #topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  #enableNotif{padding:8px 14px;border-radius:6px;border:1px solid #262B33;background:#fff;cursor:pointer;}
  #logoutBtn{padding:8px 14px;border-radius:6px;border:none;background:#262B33;color:#fff;cursor:pointer;}
  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;}
  #detailPanel{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:#fff;z-index:11;box-shadow:-4px 0 20px rgba(0,0,0,.15);padding:20px;overflow-y:auto;display:none;}
  #detailPanel .close{float:right;cursor:pointer;font-size:18px;background:none;border:none;}
  #detailPanel .row{font-size:13.5px;margin-bottom:8px;line-height:1.6;}
  #detailPanel textarea{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #ddd;font-family:inherit;}
  #chatBox{border:1px solid #eee;border-radius:6px;padding:8px;height:220px;overflow-y:auto;margin:10px 0;background:#fafafa;}
  .msg{margin:5px 0;display:flex;}
  .msg.admin{justify-content:flex-end;}
  .msg span{max-width:80%;padding:7px 11px;border-radius:10px;font-size:13px;}
  .msg.admin span{background:#262B33;color:#fff;}
  .msg.customer span{background:#eee;color:#222;}
  #chatReplyRow{display:flex;gap:6px;}
  #chatReplyRow input{flex:1;padding:8px;border-radius:6px;border:1px solid #ddd;}
  #chatReplyRow button, #detailPanel button.save{padding:8px 14px;border-radius:6px;border:none;background:#5FA83D;color:#fff;cursor:pointer;}
</style>
</head>
<body>

<div id="loginBox">
  <h1>TiffinX Admin Login</h1>
  <input id="adminEmail" type="email" placeholder="admin email">
  <input id="adminPassword" type="password" placeholder="password">
  <button onclick="adminLogin()">Log In</button>
  <div id="err"></div>
</div>

<div id="panel" style="display:none;">
  <div id="topbar">
    <h1>📋 TiffinX Registrations (live)</h1>
    <div>
      <button id="enableNotif">🔔 Enable notifications</button>
      <button id="logoutBtn" onclick="adminLogout()">Log Out</button>
    </div>
  </div>
  <table>
    <thead><tr>
      <th>Received</th><th>Name</th><th>Phone</th><th>Area</th><th>Plan</th><th>Veg</th><th>Status</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detailPanel">
  <button class="close" onclick="closeDetail()">✕</button>
  <h2>Customer Profile</h2>
  <div id="detailBody"></div>
  <h2 style="margin-top:20px;">💬 Chat with Customer</h2>
  <div id="chatBox"></div>
  <div id="chatReplyRow">
    <input id="chatReplyInput" type="text" placeholder="Reply to customer..." onkeydown="if(event.key==='Enter'){sendAdminReply();}">
    <button onclick="sendAdminReply()">Send</button>
  </div>
</div>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const STATUS_STAGE = { pending: 0, confirmed: 1, active: 2, paused: 1 };
let allRegistrations = {}; // uid -> data, kept in sync for the detail panel

window.adminLogin = async function(){
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    err.textContent = 'Login failed — check email/password, and that this account exists in Firebase Auth.';
  }
};
window.adminLogout = function(){ signOut(auth); };

function playBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

window.updateStatus = async function(uid, status){
  await updateDoc(doc(db, "registrations", uid), { status, deliveryStage: STATUS_STAGE[status] ?? 0 });
};

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ---------- Detail panel + chat ----------
let unsubChat = null;
let currentUid = null;

window.openDetail = function(uid){
  currentUid = uid;
  const d = allRegistrations[uid];
  if (!d) return;
  const meals = [d.meals?.breakfast && 'Breakfast', d.meals?.lunch && 'Lunch', d.meals?.dinner && 'Dinner'].filter(Boolean).join(', ');
  document.getElementById('detailBody').innerHTML = `
    <div class="row"><b>Name:</b> ${escapeHtml(d.name)}</div>
    <div class="row"><b>Phone:</b> ${escapeHtml(d.phone)}</div>
    <div class="row"><b>Email:</b> ${escapeHtml(d.email)}</div>
    <div class="row"><b>Address:</b> ${escapeHtml(d.address)}</div>
    <div class="row"><b>Area:</b> ${escapeHtml(d.area)}</div>
    <div class="row"><b>Plan:</b> ${escapeHtml(d.plan)}</div>
    <div class="row"><b>Meals:</b> ${meals}</div>
    <div class="row"><b>Veg/Non-veg:</b> ${escapeHtml(d.vegType)}</div>
    <div class="row"><b>Delivery time:</b> ${escapeHtml(d.deliveryTime)}</div>
    <div class="row"><b>Notes:</b> ${escapeHtml(d.notes)}</div>
    <div class="row"><b>Additional info from customer:</b> ${escapeHtml(d.extraInfo) || '(none)'}</div>
  `;
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('detailPanel').style.display = 'block';

  if (unsubChat) unsubChat();
  const q = query(collection(db, "registrations", uid, "messages"), orderBy("createdAt", "asc"));
  unsubChat = onSnapshot(q, (snap) => {
    const box = document.getElementById('chatBox');
    box.innerHTML = '';
    snap.forEach(docSnap => {
      const m = docSnap.data();
      const row = document.createElement('div');
      row.className = 'msg ' + (m.from === 'admin' ? 'admin' : 'customer');
      row.innerHTML = `<span>${escapeHtml(m.text)}</span>`;
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  });
};

window.closeDetail = function(){
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('detailPanel').style.display = 'none';
  if (unsubChat) { unsubChat(); unsubChat = null; }
  currentUid = null;
};

window.sendAdminReply = async function(){
  if (!currentUid) return;
  const input = document.getElementById('chatReplyInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addDoc(collection(db, "registrations", currentUid, "messages"), {
    from: 'admin', text, createdAt: serverTimestamp()
  });
};

// ---------- Registrations table ----------
let firstLoad = true;
let unsub = null;

onAuthStateChanged(auth, (user) => {
  document.getElementById('loginBox').style.display = user ? 'none' : 'block';
  document.getElementById('panel').style.display = user ? 'block' : 'none';
  if (unsub) { unsub(); unsub = null; }
  if (!user) return;

  firstLoad = true;
  const q = query(collection(db, "registrations"), orderBy("createdAt", "desc"));
  unsub = onSnapshot(q, (snapshot) => {
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      allRegistrations[docSnap.id] = d;
      const tr = document.createElement('tr');
      tr.className = 'clickable';
      const when = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString() : '—';
      tr.innerHTML = `
        <td>${when}</td>
        <td>${escapeHtml(d.name)}</td>
        <td>${escapeHtml(d.phone)}</td>
        <td>${escapeHtml(d.area)}</td>
        <td>${escapeHtml(d.plan)}</td>
        <td>${escapeHtml(d.vegType)}</td>
        <td><select onclick="event.stopPropagation()" onchange="updateStatus('${docSnap.id}', this.value)">
              <option value="pending" ${d.status==='pending'?'selected':''}>Pending</option>
              <option value="confirmed" ${d.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="active" ${d.status==='active'?'selected':''}>Active</option>
              <option value="paused" ${d.status==='paused'?'selected':''}>Paused</option>
            </select></td>`;
      tr.addEventListener('click', () => openDetail(docSnap.id));
      rows.appendChild(tr);
    });

    // Real-time notification for NEWLY added registrations only (not on first page load).
    if (!firstLoad) {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          const d = change.doc.data();
          playBeep();
          if (Notification.permission === 'granted') {
            new Notification('New TiffinX registration', { body: `${d.name} — ${d.area} — ${d.plan}` });
          }
        }
      });
    }
    firstLoad = false;
  });
});

document.getElementById('enableNotif').addEventListener('click', () => {
  Notification.requestPermission();
});
</script>
</body>
</html>
